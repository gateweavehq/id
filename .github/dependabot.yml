version: 2
updates:
  # Workflow actions are pinned; keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  # One weekly pull request for npm updates, so pinned versions do not drift far.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # These move together, and one of them is patched, so a pull request of their own shows up with
      # a failing install until someone moves the patch (see "A patched dependency" in
      # docs/architecture.md).
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The passkey plugin brings its own copy, and the sign-in page cancels the browser's offer through
      # that copy's abort service. A newer major of ours is a second copy whose cancel reaches nothing,
      # so this moves when @better-auth/passkey's does.
      - dependency-name: "@simplewebauthn/browser"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
