version: 2
updates:
  # Workflow actions are pinned; keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  # One weekly pull request for npm updates, so pinned versions do not drift far.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # These move together, and one of them is patched, so a pull request of their own shows up with
      # a failing install until someone moves the patch (see "A patched dependency" in
      # docs/architecture.md).
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
