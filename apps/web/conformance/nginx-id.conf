# ID over https for the conformance suite: the preview on this machine, port 4732, as https://id.localhost:4734.
events {
    worker_connections 1024;
}

http {
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;

    # Docker Desktop now and then loses a connection to this machine. By default nginx would wait 60 seconds
    # on it, which is as long as the suite gives a request, so the test ends in "Socket closed", or in a 504
    # at the browser. Nothing has reached ID at that point, so another try is safe, even for a POST, which
    # nginx does not send twice. The same address is listed three times because that is what gives nginx
    # somewhere to try next, and max_fails=0 because one lost connection says nothing about the next.
    upstream preview {
        server host.docker.internal:4732 max_fails=0;
        server host.docker.internal:4732 max_fails=0;
        server host.docker.internal:4732 max_fails=0;
    }

    server {
        listen 4734 ssl;

        location / {
            proxy_pass http://preview;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
        }
    }
}
